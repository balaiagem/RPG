[/Script/NavigationSystem.RecastNavMesh]
; Rasterizacao. Os defaults da engine (25 uu de tile, celula 19 x 10) sao
; para uma sala: sobre 1008 m de mapa e 66 m de altura dao bilhoes de
; voxels, o Recast nunca termina e nao reclama de nada. Estes numeros sao
; a diferenca entre ter malha de navegacao e nao ter.
;
; Ficam AQUI e nao no Fit-World.py porque CellSize, CellHeight e
; AgentMaxStepHeight sao protegidos no Python da engine -- o script tentou
; e falhou nos tres, e so o tile passou. Como o ator do mapa nunca teve
; esses valores editados, nada esta serializado nele e o ini chega.
RuntimeGeneration=Dynamic
TileSizeUU=1800.0
CellSize=32.0
CellHeight=25.0
AgentRadius=42.0
AgentHeight=192.0
AgentMaxHeight=200.0
AgentMaxSlope=44.0
AgentMaxStepHeight=35.0
MinRegionArea=400.0
MergeRegionSize=1600.0
MaxSimplificationError=1.5
; Tiles menores e voxels mais grossos, os dois pela mesma razao: LATENCIA.
; O log mostra `AH_MOVE sem navmesh` em campo aberto a trinta metros de uma
; masmorra -- nao e geometria, e o tile daquele pedaco ainda nao ter ficado
; pronto. Um tile de 1800 uu com celula de 32 custa ~56x56x264 voxels contra
; os ~100x100x264 de antes: cada pedaco fica pronto quase tres vezes mais
; rapido, que e o que decide se o chao existe quando voce clica nele.
; A celula NAO passa de 32: o raio do agente e 42 e o Recast precisa dele
; com mais de uma celula, senao as portas de 4,2 m comecam a fechar.
TileNumberHardLimit=1048576

[/Script/NavigationSystem.NavigationSystemV1]
; A malha so e construida em volta de quem carrega um NavigationInvoker --
; o heroi. Sem isto o Recast suja os 1600 tiles do quilometro inteiro no
; load e mastiga eles em ordem arbitraria, que e exatamente o que o log
; mostrava: caminhos parciais em alguns lugares e nada no ponto de chegada.
bGenerateNavigationOnlyAroundNavigationInvokers=True
ActiveTilesUpdateInterval=1.0
bAutoCreateNavigationData=True
bAllowClientSideNavigation=True

